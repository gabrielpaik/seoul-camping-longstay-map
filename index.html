<!doctype html>
<html lang="ko">
  <head>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header><div><p class="eyebrow">2026-10-06 · VERIFIED CANDIDATES</p><h1>서울 근교 겨울 장박 캠핑</h1><p class="sub">공식 운영·주소와 2026/27 동계 장박 공지를 분리 검증한 후보 지도</p></div><div class="legend"><span><i class="verified"></i>운영 확인</span><span><i class="partial"></i>부분 확인</span><span><i class="unknown"></i>미확인</span></div></header>
      <section class="notice">출발지는 정확한 집 주소가 아닌 <strong>우리 집(문래동) 권역 중심</strong>입니다. 차량 거리·시간은 <strong>직선거리 × 1.32, 평균 45km/h + 도심 출발 12분</strong>의 고정 추정치이며 실시간 교통이 아닙니다. 노란·빨간 핀과 ‘지역 추정’ 좌표는 내비게이션용 주소가 아닙니다.</section>
      <div id="map" aria-label="캠핑장 후보 지도"></div>
      <section class="footer"><span id="count"></span><span>베이스맵 © OpenStreetMap contributors</span></section>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="app.js"></script>
