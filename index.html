<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>서울 근교 겨울 장박 캠핑 후보 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header><div><p class="eyebrow">2026-10-06 · VERIFIED CANDIDATES</p><h1>서울 근교 겨울 장박 캠핑</h1><p class="sub">공식 운영·주소와 2026/27 동계 장박 공지를 분리 검증한 후보 지도</p></div><div class="legend"><span><i class="verified"></i>운영 확인</span><span><i class="partial"></i>부분 확인</span><span><i class="unknown"></i>미확인</span></div></header>
      <section class="notice">출발 핀은 개인정보 보호를 위해 실제 주소·좌표와 다른 <strong>우리 집(문래)</strong> 권역 표시점입니다. 거리·시간은 <strong>네이버 지도 자동차 길찾기 결과</strong>를 직접 조회한 후보에만 표시하며, 대상 명칭/주소가 미확인인 후보는 경로 조회를 보류합니다.</section>
      <div id="map" aria-label="캠핑장 후보 지도"></div>
      <section class="footer"><span id="count"></span><span>베이스맵 © OpenStreetMap contributors</span></section>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="app.js"></script>
  </body>
</html>
